name: Frontend Deployment
on:
  push:
    branches:
        - team4-agya


jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
      
    - name: Install node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
    
    - name: Run build
      working-directory: ./frontend
      run: npm run build
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy to S3 
      run: |
        aws s3 sync frontend/build/ s3://team4-cicdws-bucket --delete

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --invalidation-batch '{
            "Paths": {
              "Quantity": 1,
              "Items": ["/index.html"]
            },
            "CallerReference": "invalidate-${{ github.run_id }}"
          }'

  test:
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install cypress dependencies
      working-directory: ./e2e-tests
      run: npm install
    
    - name: Run app
      working-directory: ./frontend
      run: npm run build

    - name: Run cypress tests
      working-directory: ./e2e-tests
      run: npm run test:e2e
      env:
        CYPRESS_BASE_URL: http://localhost:3000
        CYPRESS_API_URL: http://localhost:3001/api